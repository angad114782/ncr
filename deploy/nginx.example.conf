# Example nginx server block for the pre-rendered site (propertyinncr.com).
#
# `npm run build` writes real HTML for every public URL:
#     dist/index.html, dist/about/index.html, dist/buy/mumbai/index.html, dist/blog/<slug>/index.html …
# For Google and AI crawlers to receive that HTML (instead of the empty SPA shell) nginx MUST try the
# per-route file first — the `try_files $uri $uri/ /index.html;` line below is the important one.
#
# Verify after deploying (should print an <h1>, not an empty page):
#     curl -s -A "Googlebot" https://propertyinncr.com/about | grep -o "<h1[^>]*>[^<]*"
#     curl -s -A "Googlebot" https://propertyinncr.com/buy/mumbai | grep -c "/property/"

# Old /property/<id> URLs → 301 to the readable /property/<slug> URL. The build writes the list to
# dist/property-redirects.map (lines like:  /property/p6 /property/riverside-4bhk-penthouse; ).
# Put this `map` at http {} level (e.g. in /etc/nginx/conf.d/), then `if ($property_redirect)` below.
# Without it the site still works: the pre-rendered stub page redirects instantly (canonical + refresh).
# map $uri $property_redirect {
#     default "";
#     include /var/www/propertyinncr.com/dist/property-redirects.map;
# }

server {
    listen 80;
    server_name propertyinncr.com www.propertyinncr.com;
    # ... your existing TLS / redirect config (certbot) ...

    root /var/www/propertyinncr/dist;   # <- wherever the deploy copies dist/
    index index.html;

    # ---- the backend API + uploaded images (Node on 127.0.0.1:PORT from backend/.env, run by pm2) ----
    include /var/www/propertyinncr.com/deploy/nginx-api.snippet.conf;

    # ---- compression (HTML, JS, CSS, JSON, SVG, XML, text) ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;
    # brotli on;                       # if ngx_brotli is installed — ~15-20% smaller than gzip
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- hashed build assets: cache forever (file names change when content changes) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- crawler files: always fresh, plain text / xml ----
    location = /robots.txt   { add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /sitemap.xml  { add_header Cache-Control "public, max-age=3600"; default_type application/xml;  try_files $uri =404; }
    location = /feed.xml     { add_header Cache-Control "public, max-age=3600"; default_type application/rss+xml; try_files $uri =404; }
    location = /llms.txt     { add_header Cache-Control "public, max-age=3600"; default_type text/plain; charset utf-8; try_files $uri =404; }
    location = /llms-full.txt { add_header Cache-Control "public, max-age=3600"; default_type text/plain; charset utf-8; try_files $uri =404; }

    # if ($property_redirect) { return 301 $property_redirect; }   # uncomment together with the map above

    # ---- HTML pages: revalidate every time (they change when content is republished) ----
    location / {
        add_header Cache-Control "no-cache";
        # 1) exact file  2) /path/index.html (the pre-rendered page)  3) SPA fallback for admin,
        #    dashboard and any URL that was not pre-rendered (React Router takes over in the browser)
        try_files $uri $uri/ /index.html;
    }

    # Unknown URLs that ARE pre-rendered as "not found" get a real 404 status for crawlers:
    # error_page 404 /404.html;   # only if you also want nginx (not the SPA) to answer unknown paths

    # ---- security headers (cheap, good hygiene) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
