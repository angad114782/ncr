# Site-wide basics, included ONCE inside the `server { … }` block of the site by deploy/setup-nginx.sh:
#
#     include /var/www/propertyinncr.com/deploy/nginx-site.snippet.conf;
#
# 1. One address per page: www.example.com/… is redirected (301) to example.com/…. Without it Google sees every page
#    twice (duplicate content) and the canonical / hreflang links point to a different address than the one visited.
# 2. Tells browsers and crawlers the text encoding in the HTTP header (an audit check).
# 3. One address per page, part 2: no trailing slash — the form the canonical tags, sitemap and internal links use.
#    Plain `try_files $uri $uri/` answers /about with nginx's automatic 301 to /about/, whose canonical points
#    back to /about — a loop Search Console reports as "Alternative page with proper canonical tag".
#    So:  /about/ → 301 /about (query string kept), and /about is served straight from dist/about/index.html.
#    Both only fire when that pre-rendered file really exists under this server's root, so a different
#    layout of the server block can never turn them into a redirect loop.
# 4. URLs with no pre-rendered page (admin, dashboard, unknown or retired addresses) get dist/app-shell.html —
#    an empty shell with no canonical — instead of index.html, which is the pre-rendered HOME page (canonical "/").
if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
}
charset utf-8;

if (-f $document_root${uri}index.html) {
    rewrite ^/(.+)/$ /$1 permanent;
}
if (-f $document_root$uri/index.html) {
    rewrite ^(/.+[^/])$ $1/index.html last;
}

set $app_shell "";
if (-f $document_root/app-shell.html) { set $app_shell "1"; }
if (-e $request_filename)             { set $app_shell ""; }
if ($uri ~ ^/(api|uploads|assets|\.well-known)/) { set $app_shell ""; }
if ($app_shell) {
    rewrite ^ /app-shell.html last;
}
