# Compression, included ONCE inside the `server { … }` block of the site by deploy/setup-nginx.sh:
#
#     include /var/www/propertyinncr.com/deploy/nginx-speed.snippet.conf;
#
# nginx compresses HTML by default but NOT JavaScript, CSS, JSON or SVG unless they are listed in gzip_types. Without
# this the site's ~760 KB of JavaScript and 54 KB of CSS travel uncompressed — about three times more than needed,
# which is most of the load time on a phone. (`gzip on;` itself is already active, since the HTML is compressed.)
gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml application/rss+xml text/plain;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
