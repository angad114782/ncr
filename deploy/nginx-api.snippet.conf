# Add ONCE inside the `server { … }` block of propertyinncr.com (next to `location / { … }`):
#
#     include /var/www/propertyinncr.com/deploy/nginx-api.snippet.conf;
#
# then `nginx -t && systemctl reload nginx`. This file is part of the repository, so later changes to it
# are deployed automatically with every push.
#
# It sends /api and /uploads to the backend (Node, port 5010, run by pm2). The website and the API are
# then on the SAME origin, so the login cookie needs no CORS and cannot be sent to another site.

location /api/ {
    proxy_pass http://127.0.0.1:5010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # the backend needs this to know the request was HTTPS
    proxy_read_timeout 60s;
    client_max_body_size 12m;                     # image uploads (the API enforces 8 MB per file)
    add_header Cache-Control "no-store" always;   # never cache API answers
}

location /uploads/ {
    proxy_pass http://127.0.0.1:5010;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}
