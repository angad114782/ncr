<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EFE3D7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15100C" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apply the saved light/dark choice before first paint (no flash of the wrong theme). -->
    <script>
      try {
        var t = localStorage.getItem('re-theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>

    <!-- Warm up the image hosts used by listings / agents so hero images start sooner. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.pravatar.cc" />

    <!--app-head-start-->
    <title>NCR Estates — Buy, Rent & Sell Property Across India</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NCR Estates" />
    <meta property="og:title" content="NCR Estates — Buy, Rent & Sell Property Across India" />
    <meta
      property="og:description"
      content="Find verified apartments, villas, studios and commercial properties to buy or rent across Mumbai, Delhi, Bangalore, Pune, Hyderabad, Chennai and Gurugram."
    />
    <meta property="og:image" content="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NCR Estates — Buy, Rent & Sell Property Across India" />
    <meta
      name="twitter:description"
      content="Find verified apartments, villas, studios and commercial properties to buy or rent across Mumbai, Delhi, Bangalore, Pune, Hyderabad, Chennai and Gurugram."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200" />
    <!--app-head-end-->
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot skeleton: for a URL that has no pre-rendered page (admin, dashboard, agent panel, unknown addresses) the
         server sends the home page's HTML, which would flash before the real page. Swap it for a grey skeleton at once
         (the same condition main.jsx uses to decide whether to hydrate). -->
    <script>
      ;(function () {
        var r = document.getElementById('root')
        var p = location.pathname.replace(/\/+$/, '') || '/'
        if (!r || r.dataset.route === p) return
        var b = function (h, x) { return '<div class="skeleton" style="height:' + h + 'px;border-radius:' + (x || 24) + 'px"></div>' }
        r.innerHTML =
          '<div role="status" aria-busy="true" aria-label="Loading" style="max-width:72rem;margin:0 auto;padding:1.25rem 1rem 2rem;display:flex;flex-direction:column;gap:1.25rem">' +
          b(56, 999) + b(300, 32) +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.25rem">' + b(270) + b(270) + b(270) + '</div></div>'
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
